[project]
name = "climate-cat"
version = "0.0.1"
description = "European multi-peril catastrophe platform (underwriting wedge)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Ingestion + geospatial (hazard rasters, geocoding). Not needed to run engine tests.
geo = [
    "pandas>=2.1",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "openpyxl>=3.1",
]
# API layer
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[tool.setuptools]
packages = ["engine", "engine.scenario", "engine.perils", "data", "data.ingest", "backend", "backend.app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
