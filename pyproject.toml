[project]
name = "climate-cat"
version = "0.0.1"
description = "European multi-peril catastrophe platform (underwriting wedge)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Ingestion + geospatial (hazard rasters, geocoding). Not needed to run engine tests, and
# deliberately NOT installed in the deployed image — only the offline hazard prep script
# needs these, and it runs on a developer machine and writes results to the database.
geo = [
    "pandas>=2.1",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "openpyxl>=3.1",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "scipy>=1.11",
]
# API layer
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",  # floor matches the rule codes selected below
    "httpx>=0.27",  # starlette's TestClient transport, used by tests/test_api.py
]

[tool.setuptools]
packages = ["engine", "engine.scenario", "engine.perils", "data", "data.ingest", "backend", "backend.app", "backend.app.api", "backend.app.models"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Select explicitly rather than riding ruff's defaults. Those defaults widened in 0.16 and
# broke CI on a release nobody here made — with the set named, a version bump can change how
# a rule is implemented but not which rules the build enforces.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# FastAPI's dependency injection *requires* calls in argument defaults (Depends, File, Form).
# B008 is a true positive in ordinary Python and a false one for every route we will ever write.
ignore = ["B008"]
