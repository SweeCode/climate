name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    # The engine, ingestion, latency and calibration suites depend only on numpy. Running them
    # as their own job keeps that guarantee honest — if someone gives the core a database
    # dependency, this job fails rather than passing quietly inside the API job.
    name: engine (no infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check engine data backend scripts tests
      - run: pytest -q --ignore=tests/test_api.py
      - name: Sanity anchor — storm concentrates in the swath, Madrid untouched
        run: python scripts/demo_scenario.py

  api:
    name: api (PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: climate
          POSTGRES_PASSWORD: climate
          POSTGRES_DB: climate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U climate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,api]"
      - run: pytest -q tests/test_api.py
        env:
          CLIMATE_TEST_DATABASE_URL: postgresql+psycopg2://climate:climate@localhost:5432/climate

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  image:
    # The deployable artefact. Without this job a broken Dockerfile is discovered inside the
    # host's dashboard, mid-deploy, which is the worst place to learn it — and the image is
    # built from a different dependency set than any job above (no [dev], no [geo]).
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # into the local daemon, so the boot check below can run it
          tags: climate-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and check /health
        run: |
          # No database is configured here, so init_db fails by design — /health must answer
          # anyway, because that is exactly what a platform health probe hits on a cold start
          # before the database env var has ever been read.
          docker run -d --name climate -p 8000:8000 climate-ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:8000/health && break || sleep 2
          done
          docker logs climate   # printed before the assertion, so a failure shows why
          curl -fsS http://localhost:8000/health | grep -q '"ok"'
          docker rm -f climate
